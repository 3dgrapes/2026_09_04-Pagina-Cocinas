<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visor de cocina - punto de partida</title>
  <style>
    body { margin: 0; overflow: hidden; background: #222; }
    canvas { display: block; }
  </style>
</head>
<body>
 
  
  <div id="panelCatalogo" style="position:absolute; top:20px; left:20px; z-index:10; display:flex; flex-direction:column; gap:6px;"></div>
  <div id="aviso" style="display:none; position:absolute; top:20px; right:20px; z-index:10; background:#b00020; color:#fff; padding:8px 12px; border-radius:6px; font-family:sans-serif;"></div>

  <div style="position:absolute; bottom:20px; left:20px; z-index:10; color:#fff; font-family:sans-serif;">
    Ancho (m) <input id="inputAncho" type="number" min="1" step="0.5" value="10" style="width:60px">
    Fondo (m) <input id="inputFondo" type="number" min="1" step="0.5" value="10" style="width:60px">
    <div style="margin-top:6px; font-size:13px; opacity:0.7;">Clic: seleccionar · Esfera naranja: rotar · Supr: eliminar · Esc: quitar selección</div>
  </div>

  <!--
    Import map: le dice al navegador de dónde traer "three" cuando
    lo pidamos con import. Así no necesitas npm ni un bundler.
    Es como un CDN, pero usando la sintaxis moderna de módulos JS.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    import { DEFINICIONES, precargarCatalogo } from './js/catalogo.js';
    import { ModuloGabinete } from './js/ModuloGabinete.js';
    import { crearArrastre } from './js/arrastre.js';
    import { crearPiso } from './js/piso.js';
    import { limitarCamara } from './js/camara.js';
    import { buscarLugarLibre } from './js/colocacion.js';
    import { crearGizmoRotacion } from './js/gizmoRotacion.js';
    import { crearCotas } from './js/cotas.js';

    // Setup ---------------------------------------------------------------------------------------------------------------

    // Escena
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2b2b);
    
    // Camara
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 3, 5);
    
    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
  
    // Aplicamos la pantalla a la página
    document.body.appendChild(renderer.domElement);
    
    // Ponemos luz ambiental
    const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(luzAmbiente);
    
    // Luz direccional
    const luzDireccional = new THREE.DirectionalLight(0xffffff, 1);
    luzDireccional.position.set(5, 10, 7);
    scene.add(luzDireccional);

    // Ambiente
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment()).texture

    // Controles de órbita: te dejan girar/hacer zoom con el mouse para inspeccionar el modelo mientras desarrollas.
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // DE AQUI HACIA ARRIBA NO SE TOCA NADA ###################################################################################################################################################


    // Piso
    const piso = crearPiso(scene, 10, 10);

    const ModulosEnEscena = [];
    
    const aviso = document.getElementById('aviso');
    const gizmo = crearGizmoRotacion({ scene, camera, renderer }); // anillo + esfera del módulo seleccionado
    const cotas = crearCotas({ scene, camera, renderer, modulos: ModulosEnEscena }); // líneas de medida
    const arrastre = crearArrastre({
      modulos: ModulosEnEscena,
      camera,
      renderer,
      orbit: controls,
      piso,
      gizmo,
      alCambiarEstado: (n) => {
        aviso.style.display = n > 0 ? 'block' : 'none';
        aviso.textContent = n === 1 ? '1 módulo fuera del piso' : `${n} módulos fuera del piso`;
      },
      // Se usa "arrastre" dentro de la función aunque se esté creando en esta misma línea:
      // funciona porque la función no se ejecuta ahora, sino después, cuando algo cambie
      alCambiarEscena: () => cotas.recalcular(arrastre.obtenerSeleccionado())
    });
    const limites = limitarCamara({ controls, camera, piso });

    // Agregar módulos -----------------------------------------------------------------
    function agregarModulo(tipo) {
      // Primero se crea, porque para buscarle lugar hay que conocer su tamaño
      const modulo = new ModuloGabinete({ tipo });
      const lugar = buscarLugarLibre({ modulo, modulos: ModulosEnEscena, piso });

      if (!lugar) {
        modulo.liberar(); // no se usó: se liberan sus materiales
        alert('No hay espacio libre en el piso para este módulo.');
        return;
      }

      modulo.mesh.position.copy(lugar);
      scene.add(modulo.mesh);
      ModulosEnEscena.push(modulo.mesh);
      arrastre.revisarTodos();
    }

    // Eliminar módulos ----------------------------------------------------------------
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return; // en los campos del piso, Supr borra texto, no módulos

      if (e.key === 'Escape') arrastre.deseleccionar();

      if (e.key === 'Delete' || e.key === 'Backspace') { // Delete = Supr
        // Primero el seleccionado; si no hay, el que está bajo el cursor
        // (?? usa el de la derecha solo si el de la izquierda es null)
        const modulo = arrastre.obtenerSeleccionado() ?? arrastre.obtenerHover();
        if (modulo) arrastre.quitar(modulo);
      }
    });

    // Animación -----------------------------------------------------------------------
    function animar() {
      requestAnimationFrame(animar);
      limites.aplicar();
      controls.update();
      gizmo.actualizar(); // después de mover la cámara, para que la etiqueta quede en su lugar
      cotas.actualizarEtiquetas();
      renderer.render(scene, camera);
    }
    animar();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Catálogo y botones (siempre al final) ---------------------------------------------
    await precargarCatalogo();

    const panel = document.getElementById('panelCatalogo');
    for (const def of DEFINICIONES) {
      const boton = document.createElement('button');
      boton.textContent = def.nombre;
      boton.addEventListener('click', () => agregarModulo(def.tipo));
      panel.appendChild(boton);
    }

    // Piso ------------------------------------------------------------------------------
    const inputAncho = document.getElementById('inputAncho');
    const inputFondo = document.getElementById('inputFondo');

    function cambiarPiso() {
      const ancho = parseFloat(inputAncho.value);
      const fondo = parseFloat(inputFondo.value);
      if (!(ancho >= 1 && fondo >= 1)) return;
      piso.redimensionar(ancho, fondo);
      limites.actualizar();
      arrastre.revisarTodos(); // algún módulo pudo quedar fuera
    }
    inputAncho.addEventListener('change', cambiarPiso);
    inputFondo.addEventListener('change', cambiarPiso);

  </script>





</body>
</html>
